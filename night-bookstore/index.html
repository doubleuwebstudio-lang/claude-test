<title>밤의 서점</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;600;800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Gothic+Coding&display=swap">
<style>
/* Layout: 화면 전체가 3D 책방. 위에는 간판 알약(가게 이름·지금 머무는 사람·쪽지·소리), 아래에는 행동 막대(책 펴기·앉기·차·손 흔들기),
   가까이 가면 가운데에 '꺼내기' 단추가 뜨고, 책을 펴면 종이 한 장이 아래에서 올라온다. 밤에만 여는 가게라 어두운 화면 하나로 고정. */
:root {
  --night: #0f1420;
  --glass: rgba(18, 24, 38, .72);
  --glass-line: rgba(240, 199, 122, .18);
  --lamp: #f0c77a;
  --lamp-dim: #a98a55;
  --paper: #eee4cc;
  --ink: #2b2520;
  --stamp: #b4432e;
  --muted: #9aa2b8;
  --fg: #ece8de;
  --f-display: "Hahmlet", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-poem: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-ui: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-code: "Nanum Gothic Coding", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; background: var(--night); color: var(--fg); overflow: hidden; }
body { font-family: var(--f-ui); font-size: 15px; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; border-radius: 8px; }

#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }

.glass {
  background: var(--glass); border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
  border-radius: 999px; box-shadow: 0 10px 30px -12px rgba(0,0,0,.6);
}

/* 윗줄 */
.top {
  position: fixed; z-index: 5; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.signpill { display: flex; align-items: center; gap: 12px; padding: 9px 16px 9px 18px; min-width: 0; }
.signpill h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 19px; color: var(--lamp); white-space: nowrap; letter-spacing: -.01em; }
.signpill .sep { width: 1px; height: 16px; background: var(--glass-line); }
.who { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.who i { width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); box-shadow: 0 0 8px var(--lamp); }
.who.closed i { background: var(--muted); box-shadow: none; }
.rightpill { display: flex; align-items: center; gap: 2px; padding: 4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.iconbtn:hover { background: rgba(255,255,255,.06); }
.iconbtn svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.iconbtn[aria-pressed="true"] svg { stroke: var(--lamp); }
.hours { position: fixed; z-index: 5; top: calc(66px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));
  font-size: 12px; color: var(--muted); font-family: var(--f-code); pointer-events: none; text-shadow: 0 1px 2px #000; }

/* 이름표 */
.tags { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.tag {
  position: absolute; left: 0; top: 0; white-space: nowrap;
  display: flex; align-items: center; gap: 6px; padding: 4px 11px 4px 4px; border-radius: 999px;
  background: rgba(238, 228, 204, .92); color: var(--ink); font-size: 12.5px; box-shadow: 0 4px 12px rgba(0,0,0,.35);
}
.tag b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 400; background: #4a4038; color: var(--paper); }
.tag.peer { background: rgba(18,24,38,.8); color: var(--fg); border: 1px solid var(--glass-line); padding: 3px 10px; }
.tag.peer:empty { display: none; }

/* 가까이 가면 뜨는 단추 */
.prompt {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  padding: 12px 22px; font-size: 15px; display: flex; gap: 10px; align-items: center; white-space: nowrap;
  border-color: rgba(240,199,122,.45); color: var(--fg);
  animation: rise .25s ease;
}
.prompt small { color: var(--muted); font-size: 12px; }
.prompt b { color: var(--lamp); font-weight: 400; }
@keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }

/* 행동 막대 */
.actions {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(4, 1fr); width: min(460px, calc(100% - 24px)); box-sizing: border-box;
  padding: 6px; border-radius: 26px;
}
.act { display: grid; justify-items: center; gap: 4px; padding: 9px 4px 8px; border-radius: 20px; font-size: 13px; color: var(--fg); }
.act:hover { background: rgba(255,255,255,.05); }
.act svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.act[aria-pressed="true"] { color: var(--lamp); background: rgba(240,199,122,.08); }

/* 조이스틱 */
.joy { position: fixed; z-index: 4; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
  border: 1.5px solid rgba(240,199,122,.35); background: rgba(15,20,32,.25); pointer-events: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(240,199,122,.5); }
.hint { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  font-size: 12.5px; color: var(--muted); white-space: nowrap; text-shadow: 0 1px 3px #000; pointer-events: none; transition: opacity .6s; }

/* 펼친 책 (아래에서 올라오는 종이) */
.sheet-back { position: fixed; inset: 0; z-index: 9; background: rgba(5,8,14,.45); }
.sheet {
  position: fixed; z-index: 10; left: 50%; transform: translateX(-50%);
  bottom: 0; width: min(620px, 100%); max-height: calc(100% - 70px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  background: var(--paper); color: var(--ink); border-radius: 18px 18px 0 0;
  padding: 22px max(22px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(22px, env(safe-area-inset-left, 0px));
  box-shadow: 0 -20px 60px rgba(0,0,0,.6); animation: up .3s ease; box-sizing: border-box;
  display: grid; gap: 18px;
}
@keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } }
.sheet .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--f-code); font-size: 12px; color: #7a6c5b; }
.close { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); flex: none; }
.close:hover { background: rgba(0,0,0,.06); }
.poem { font-family: var(--f-poem); font-weight: 400; font-size: clamp(20px, 5vw, 24px); line-height: 1.85; margin: 0; white-space: pre-line; }
.byline { font-family: var(--f-poem); font-size: 14px; color: #6b5d4e; margin: -6px 0 0; }
.byline b { color: var(--ink); }
.blk { display: grid; gap: 8px; border-top: 1px solid rgba(43,37,32,.14); padding-top: 14px; }
.blk h3 { margin: 0; font-family: var(--f-display); font-size: 15px; font-weight: 600; display: flex; justify-content: space-between; }
.blk h3 span { font-family: var(--f-code); font-size: 12px; font-weight: 400; color: #7a6c5b; }
.trace { font-family: var(--f-poem); font-size: 16px; line-height: 1.8; white-space: pre-wrap; }
.trace .d { color: #9a5b12; }
.trace .x { color: var(--stamp); text-decoration: underline wavy rgba(180,67,46,.5); }
.trace .p { color: #b3a68f; }
.sheet textarea, .sheet input[type="text"] {
  width: 100%; box-sizing: border-box; background: #f7f0de; color: var(--ink); border: 1px solid rgba(43,37,32,.2);
  border-radius: 10px; padding: 10px 12px; font-family: var(--f-poem); font-size: 16px; line-height: 1.7; resize: none;
}
.sheet textarea:focus, .sheet input:focus { outline: none; border-color: #9a5b12; }
.done { color: #9a5b12; font-size: 13px; }
.primary { background: var(--ink); color: var(--paper); border-radius: 12px; padding: 13px 16px; font-weight: 700; }
.primary:disabled { opacity: .55; cursor: default; }
.cardimg { width: min(320px, 100%); border-radius: 6px; box-shadow: 0 14px 30px -14px rgba(0,0,0,.6); justify-self: center; }
.small { font-size: 13px; color: #6b5d4e; margin: 0; }
.notes { display: grid; gap: 10px; }
.note { background: #f7f0de; border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.note p { margin: 0; font-family: var(--f-poem); font-size: 16px; overflow-wrap: anywhere; }
.note span { font-family: var(--f-code); font-size: 11px; color: #7a6c5b; }
.empty { color: #7a6c5b; font-size: 14px; border: 1px dashed rgba(43,37,32,.25); border-radius: 10px; padding: 14px; }

.toast {
  position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -10px);
  background: var(--paper); color: var(--ink); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 20;
  opacity: 0; pointer-events: none; transition: .3s; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.loading { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--night); text-align: center; transition: opacity .8s; }
.loading h2 { font-family: var(--f-display); font-weight: 800; font-size: 44px; color: var(--lamp); margin: 0 0 8px; text-shadow: 0 0 30px rgba(240,199,122,.4); }
.loading p { color: var(--muted); margin: 0; padding: 0 24px; }

@media (max-width: 520px) {
  .signpill { padding: 8px 12px 8px 14px; gap: 9px; }
  .signpill h1 { font-size: 17px; }
  .iconbtn { width: 36px; height: 36px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="stage" aria-label="밤의 서점 3D 공간. 끌어서 둘러보고, 바닥을 눌러 걸어가세요."></div>
<div class="tags" id="tags"></div>

<div class="top">
  <div class="signpill glass">
    <h1>밤의 서점</h1><span class="sep"></span>
    <span class="who" id="who"><i></i><span id="whoText">불 켜는 중</span></span>
  </div>
  <div class="rightpill glass">
    <button class="iconbtn" id="boardBtn" aria-label="오늘 밤 남겨진 한 줄 보기">
      <svg viewBox="0 0 24 24"><path d="M5 4h14v16l-4-3H5z"/><path d="M8 9h8M8 12.5h5"/></svg>
    </button>
    <button class="iconbtn" id="soundBtn" aria-pressed="false" aria-label="빗소리 켜기">
      <svg viewBox="0 0 24 24"><path d="M4 10h3l5-4v12l-5-4H4z"/><path id="soundWave" d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
  </div>
</div>
<div class="hours" id="hours"></div>

<button class="prompt glass" id="prompt" hidden></button>
<div class="hint" id="hint">끌어서 둘러보고, 바닥을 눌러 걸어가세요</div>
<div class="joy" id="joy" hidden><i id="joyKnob"></i></div>

<nav class="actions glass" aria-label="행동">
  <button class="act" id="actRead"><svg viewBox="0 0 24 24"><path d="M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1v13c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6.5v13"/></svg>책 펴기</button>
  <button class="act" id="actSit" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 11V5h12v6"/><path d="M4 11h16v4H4z"/><path d="M6 15v4M18 15v4"/></svg><span>앉기</span></button>
  <button class="act" id="actTea" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 3c-1 1.2 1 2 0 3.5M12.5 3c-1 1.2 1 2 0 3.5"/></svg>차 한 잔</button>
  <button class="act" id="actWave"><svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V5a1.5 1.5 0 0 1 3 0v6"/><path d="M14 11V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7L3.8 14.6a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg>손 흔들기</button>
</nav>

<div class="sheet-back" id="sheetBack" hidden></div>
<section class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheetTitle"></section>

<div class="toast" id="toast" role="status"></div>
<div class="loading" id="loading"><div><h2>밤의 서점</h2><p id="loadMsg">스탠드 불을 켜는 중이에요</p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ───────── 서가의 시 (모두 저작권 보호 기간이 끝난 작품) ───────── */
  const BOOKS = [
    { id: "seosi", poet: "윤동주", title: "서시", call: "811.6 윤25ㅅ", text: "죽는 날까지 하늘을 우러러\n한 점 부끄럼이 없기를" },
    { id: "byeol", poet: "윤동주", title: "별 헤는 밤", call: "811.6 윤25ㅂ", text: "별 하나에 추억과\n별 하나에 사랑과\n별 하나에 쓸쓸함과" },
    { id: "gaeul", poet: "윤동주", title: "별 헤는 밤", call: "811.6 윤25ㅂ.2", text: "계절이 지나가는 하늘에는\n가을로 가득 차 있습니다." },
    { id: "swipge", poet: "윤동주", title: "쉽게 씌어진 시", call: "811.6 윤25ㅅ.2", text: "인생은 살기 어렵다는데\n시가 이렇게 쉽게 씌어지는 것은\n부끄러운 일이다." },
    { id: "gil", poet: "윤동주", title: "새로운 길", call: "811.6 윤25ㅅ.3", text: "어제도 가고 오늘도 갈\n나의 길 새로운 길" },
    { id: "sanyu", poet: "김소월", title: "산유화", call: "811.6 김55ㅅ", text: "산에는 꽃 피네\n꽃이 피네\n갈 봄 여름 없이\n꽃이 피네" },
    { id: "jindal", poet: "김소월", title: "진달래꽃", call: "811.6 김55ㅈ", text: "나 보기가 역겨워\n가실 때에는\n말없이 고이 보내 드리우리다" },
    { id: "eomma", poet: "김소월", title: "엄마야 누나야", call: "811.6 김55ㅇ", text: "엄마야 누나야 강변 살자\n뜰에는 반짝이는 금모래 빛" },
    { id: "nim", poet: "한용운", title: "님의 침묵", call: "811.6 한66ㄴ", text: "우리는 만날 때에 떠날 것을 염려하는 것과 같이\n떠날 때에 다시 만날 것을 믿습니다." },
    { id: "hosu", poet: "정지용", title: "호수", call: "811.6 정79ㅎ", text: "얼굴 하나야\n손바닥 둘로\n폭 가리지만,\n보고 싶은 마음\n호수만 하니\n눈 감을 밖에." },
    { id: "hyangsu", poet: "정지용", title: "향수", call: "811.6 정79ㅎ.2", text: "넓은 벌 동쪽 끝으로\n옛이야기 지줄대는 실개천이 회돌아 나가고" },
    { id: "moran", poet: "김영랑", title: "모란이 피기까지는", call: "811.6 김64ㅁ", text: "모란이 피기까지는\n나는 아직 나의 봄을 기다리고 있을테요" },
    { id: "cheongpo", poet: "이육사", title: "청포도", call: "811.6 이66ㅊ", text: "내 고장 칠월은\n청포도가 익어 가는 시절" },
    { id: "gwangya", poet: "이육사", title: "광야", call: "811.6 이66ㄱ", text: "지금 눈 나리고\n매화 향기 홀로 아득하니\n내 여기 가난한 노래의 씨를 뿌려라" },
    { id: "bom", poet: "이상화", title: "빼앗긴 들에도 봄은 오는가", call: "811.6 이52ㅃ", text: "지금은 남의 땅\n빼앗긴 들에도 봄은 오는가?" }
  ];
  const byId = (id) => BOOKS.find((b) => b.id === id);

  function nightKey(d = new Date()) {
    const t = new Date(d); if (t.getHours() < 4) t.setDate(t.getDate() - 1);
    return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`;
  }
  function tonightBook() {
    let h = 0; for (const c of nightKey()) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return BOOKS[h % BOOKS.length];
  }
  const isOpen = () => { const h = new Date().getHours(); return h >= 22 || h < 4; };

  const local = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  let tt;
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2400); }

  if (!window.THREE) { $("loadMsg").textContent = "3D 화면을 불러오지 못했어요. 새로고침해 주세요."; return; }

  /* ───────── 렌더러와 장면 ───────── */
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); }
  catch (e) { $("loadMsg").textContent = "이 기기에서는 3D 화면을 열 수 없어요."; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  $("stage").appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0f19);
  scene.fog = new THREE.Fog(0x0b0f19, 14, 34);
  const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 80);

  const RW = 12, RD = 9, RH = 4.4;               // 방 반폭, 반깊이, 높이
  const solids = [];                             // 부딪히는 사각형
  const spots = [];                              // 가까이 가면 뜨는 것들

    $("cardOut").innerHTML = `<div class="blk"><h3>대출 카드</h3><img class="cardimg" id="cardImg" alt="고른 문장과 남긴 한 줄이 적힌 대출 카드">
      <p class="small">휴대폰에서는 카드를 길게 눌러, 컴퓨터에서는 오른쪽 클릭해서 저장하세요. 4:5 비율이라 그대로 올리기 좋아요.</p></div>`;
    $("cardImg").src = url; btn.textContent = "카드를 받았어요";
    $("cardImg").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" });
  }

  /* 쪽지 벽 */
  function openBoard() {
    const list = notes.slice().sort((a, b) => (b.at || 0) - (a.at || 0));
    const mine = local.get("nightshop.v1", []).filter((e) => e.note).slice(0, 5);
    const item = (n) => { const b = byId(n.book || n.id); return `<div class="note"><p>${esc(n.text || n.note)}</p><span>${b ? esc(`${b.poet} 「${b.title}」`) : ""}</span></div>`; };
    openSheet(`
      <div class="head"><span>쪽지 벽 · ${esc(nightKey())} 밤</span><button class="close" aria-label="닫기">${closeSvg}</button></div>
      <h2 id="sheetTitle" class="poem" style="font-size:22px">오늘 밤 남겨진 한 줄</h2>
      ${db ? (list.length ? `<div class="notes">${list.map(item).join("")}</div>` : `<div class="empty">아직 붙은 쪽지가 없어요. 책을 펴고 한 줄을 남기면 첫 쪽지가 돼요.</div>`)
           : `<div class="empty">이 화면에서는 다른 손님의 쪽지를 불러올 수 없어요. 로그인한 상태로 열면 함께 볼 수 있어요.</div>`}
      <div class="blk"><h3>내 책장 <span>이 기기에만</span></h3>${mine.length ? `<div class="notes">${mine.map(item).join("")}</div>` : `<p class="small">아직 남긴 한 줄이 없어요.</p>`}</div>`);
  }
  $("boardBtn").addEventListener("click", openBoard);

  /* ───────── 빗소리 ───────── */
  let audio = null;
  $("soundBtn").addEventListener("click", () => {
    try {
      if (!audio) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0); let last = 0;
        for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = last * 3.2 + w * .04; }
        const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
        const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
        const gain = ctx.createGain(); gain.gain.value = 0; src.connect(lp).connect(gain).connect(ctx.destination); src.start();
        audio = { ctx, gain, on: false };
      }
      audio.on = !audio.on; if (audio.ctx.state === "suspended") audio.ctx.resume();
      audio.gain.gain.linearRampToValueAtTime(audio.on ? .5 : 0, audio.ctx.currentTime + .8);
      $("soundBtn").setAttribute("aria-pressed", String(audio.on)); $("soundBtn").setAttribute("aria-label", audio.on ? "빗소리 끄기" : "빗소리 켜기");
      $("soundWave").setAttribute("d", audio.on ? "M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" : "M16 9l5 6M21 9l-5 6");
    } catch { toast("이 브라우저에서는 소리를 낼 수 없어요"); }
  });

  /* ───────── room: 지금 함께 있는 손님 ───────── */
  function presenceState() {
    return { x: +me.x.toFixed(2), z: +me.z.toFixed(2), r: +me.r.toFixed(2), m: me.moving ? 1 : 0, s: me.seated ? (me.floorSit ? 2 : 1) : 0,
      h: me.hold || "", w: me.waveUntil > Date.now() ? me.waveUntil : 0, c: myColor };
  }
  let lastSent = 0, lastKey = "";
  function sendPresence(force) {
    if (!room) return;
    const now = performance.now(); if (!force && now - lastSent < 140) return;
    const p = presenceState(), k = JSON.stringify(p); if (k === lastKey) return;
    lastKey = k; lastSent = now; room.presence(p).catch(() => {});
  }
  function updateWho() {
    $("who").classList.toggle("closed", !isOpen());
    $("whoText").textContent = room ? `지금 ${1 + peers.size}명 머무는 중` : (isOpen() ? "영업 중" : "준비 중");
  }
  const clamp = (v, m) => Math.max(-m, Math.min(m, v));
  function onPeers(change) {
    const seen = new Set();
    for (const p of change.peers) {
      if (p.isMe || p.kind !== "viewer") continue;
      const pr = p.presence || {}; if (typeof pr.x !== "number" || typeof pr.z !== "number") continue;
      seen.add(p.peer);
      let e = peers.get(p.peer);
      if (!e) {
        if (peers.size >= 40) continue;
        const ci = Number.isInteger(pr.c) ? Math.abs(pr.c) % 48 : 0;
        const tag = document.createElement("div"); tag.className = "tag peer"; $("tags").appendChild(tag);
        e = { a: makeAvatar(ci), st: { x: clamp(pr.x, RW), z: clamp(pr.z, RD), r: 0 }, tag }; peers.set(p.peer, e);
      }
      Object.assign(e.st, { tx: clamp(pr.x, RW), tz: clamp(pr.z, RD), tr: +pr.r || 0, moving: pr.m === 1, seated: pr.s > 0, floorSit: pr.s === 2,
        hold: pr.h === "book" || pr.h === "cup" ? pr.h : null, waveUntil: Math.min(+pr.w || 0, Date.now() + 3000) });
    }
    for (const [k, e] of peers) if (!seen.has(k)) { scene.remove(e.a.g); e.tag.remove(); peers.delete(k); }
    updateWho();
  }
  (async () => {
    if (!window.claude || !window.claude.use) return;
    try {
      room = await window.claude.use("room");
      if (room) { room.onPeers(onPeers, () => { room = null; updateWho(); }); sendPresence(true); updateWho(); }
    } catch { room = null; }
    try {
      const [d, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (d && user) {
        uid = await user.id();
        if (uid) {
          db = d;
          db.collection("notes").where("night", "==", nightKey()).limit(200).onSnapshot((snap) => {
            notes = snap.docs.map((s) => s.data()).filter((n) => n && typeof n.text === "string" && n.text.length <= 60);
            setSlips(notes.length);
          }, () => {});
        }
      }
    } catch { db = null; }
  })();

  /* ───────── 이름표 ───────── */
  const myTag = document.createElement("div"); myTag.className = "tag"; myTag.innerHTML = `<b>나</b><span id="myTagText">밤손님</span>`; $("tags").appendChild(myTag);
  const v3 = new THREE.Vector3();
  function placeTag(tag, x, y, z) {
    v3.set(x, y, z).project(camera);
    if (v3.z > 1 || v3.z < -1) { tag.style.visibility = "hidden"; return; }
    tag.style.visibility = "";
    tag.style.transform = `translate(${(v3.x * .5 + .5) * innerWidth}px, ${(-v3.y * .5 + .5) * innerHeight}px) translate(-50%, -100%)`;
  }

  /* ───────── 시계 ───────── */
  function tick() {
    const d = new Date();
    $("hours").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())} · ${isOpen() ? "새벽 4시까지 열어요" : "밤 10시에 불을 켜요"}`;
    updateWho();
  }
  tick(); setInterval(tick, 30000);

  /* ───────── 루프 ───────── */
  function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  addEventListener("resize", resize); resize();

  const camPos = new THREE.Vector3(me.x, 3, me.z + 4), look = new THREE.Vector3(), want = new THREE.Vector3();
  let last = performance.now(), frame = 0;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000; frame++;

    let ix = 0, iy = 0;
    if (!sheetOpen) {
      if (keys["w"] || keys["arrowup"]) iy -= 1; if (keys["s"] || keys["arrowdown"]) iy += 1;
      if (keys["a"] || keys["arrowleft"]) ix -= 1; if (keys["d"] || keys["arrowright"]) ix += 1;
      if (joy.active) { ix += joy.x; iy += joy.y; }
    }
    const sy = Math.sin(yaw), cy = Math.cos(yaw);
    let mx = sy * iy + cy * ix, mz = cy * iy - sy * ix;
    if (Math.hypot(ix, iy) > .15) { target = null; standUp(); hideHint(); }
    else { mx = mz = 0; if (target) { const dx = target.x - me.x, dz = target.z - me.z, L = Math.hypot(dx, dz); if (L < .12) target = null; else { mx = dx / L; mz = dz / L; } } }
    const ml = Math.hypot(mx, mz);
    me.moving = ml > .05 && !me.seated;
    if (me.moving) {
      const sp = 2.6 * Math.min(1, ml) * dt, nx = mx / ml, nz = mz / ml, ox = me.x, oz = me.z;
      if (!blocked(me.x + nx * sp, me.z)) me.x += nx * sp;
      if (!blocked(me.x, me.z + nz * sp)) me.z += nz * sp;
      if (target && Math.hypot(me.x - ox, me.z - oz) < sp * .2) target = null;
      let d = Math.atan2(nx, nz) - me.r; d = Math.atan2(Math.sin(d), Math.cos(d)); me.r += d * Math.min(1, dt * 12);
    }
    meA.g.position.set(me.x, 0, me.z); meA.g.rotation.y = me.r;
    animateAvatar(meA, me, t, dt);
    sendPresence(false);

    for (const e of peers.values()) {
      const s = e.st, k = Math.min(1, dt * 8);
      s.x += (s.tx - s.x) * k; s.z += (s.tz - s.z) * k;
      let d = s.tr - s.r; d = Math.atan2(Math.sin(d), Math.cos(d)); s.r += d * k;
      e.a.g.position.set(s.x, 0, s.z); e.a.g.rotation.y = s.r; animateAvatar(e.a, s, t, dt);
      e.tag.textContent = s.hold === "book" ? "읽는 중" : s.waveUntil > Date.now() ? "안녕하세요" : s.hold === "cup" ? "차 마시는 중" : "";
    }

    const hor = Math.cos(pitch) * camDist;
    want.set(me.x + sy * hor, .9 + Math.sin(pitch) * camDist, me.z + cy * hor);
    want.x = Math.max(-RW + .5, Math.min(RW - .5, want.x)); want.z = Math.max(-RD + .5, Math.min(RD - .5, want.z)); want.y = Math.min(RH - .3, want.y);
    camPos.lerp(want, Math.min(1, dt * 6)); camera.position.copy(camPos);
    look.set(me.x, me.seated ? 1 : 1.15, me.z); camera.lookAt(look);

    if (!reduced) {
      tBook.position.y = 1.0 + Math.sin(t * 1.4) * .03; tBook.rotation.y = Math.sin(t * .5) * .15;
      glow.intensity = 1 + Math.sin(t * 2.1) * .12;
      pendants.forEach((l, i) => { l.intensity = (i === 2 ? 1.1 : 1.3) + Math.sin(t * 3 + i * 2) * .03; });
      const pa = dust.geometry.attributes.position.array;
      for (let i = 0; i < dn; i++) { pa[i * 3 + 1] += Math.sin(t + i) * .0012; pa[i * 3] += Math.cos(t * .5 + i) * .0008; }
      dust.geometry.attributes.position.needsUpdate = true;
      catBody.scale.y = .6 + Math.sin(t * 1.6) * .03;
      tail.rotation.z = catPurr > 0 ? Math.sin(t * 8) * .5 : Math.sin(t * .7) * .1; catPurr = Math.max(0, catPurr - dt);
      if (frame % 2 === 0) { drawRain(); rainTex.needsUpdate = true; }
    }

    renderer.render(scene, camera);

    $("myTagText").textContent = me.hold === "book" ? "읽는 중" : me.hold === "cup" ? "차 마시는 중" : me.seated ? "쉬는 중" : me.moving ? "느린 걸음" : "밤손님";
    placeTag(myTag, me.x, me.seated ? (me.floorSit ? 1.45 : 1.95) : 1.9, me.z);
    for (const e of peers.values()) placeTag(e.tag, e.st.x, e.st.seated ? 1.9 : 1.85, e.st.z);
    updatePrompt();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame((n) => { last = n; loop(n); setTimeout(() => { const l = $("loading"); l.style.opacity = 0; setTimeout(() => l.remove(), 800); }, 400); });
  if (document.fonts) document.fonts.ready.then(drawPlaques).catch(() => {});
})();
</script>
