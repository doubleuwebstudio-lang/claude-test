<title>왜그래 골목</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 화면 전체가 비 젖은 뒷골목 3D. 위: 간판 알약(골목 이름·지금 있는 사람) + 방금 일어난 일 띠.
   아래: 행동 막대(고민 카드·도장·손 흔들기). 가게 문 앞에 서면 '들어가기'가 뜨고, 가게 안은 아래에서 올라오는 어두운 판.
   진단서만 종이. 네온 골목 하나로 고정된 어두운 화면. */
:root {
  --night: #0b0c11;
  --panel: #14161f;
  --panel-2: #1c1f2b;
  --line: #2a2e3d;
  --fg: #eceef3;
  --muted: #9097a8;
  --neon-y: #ffd84d;   /* 접수처 */
  --neon-c: #4fd2ff;   /* 통역소 */
  --neon-p: #ff5c9e;   /* 입장바꿔방 */
  --neon-v: #b77bff;   /* 타로 */
  --neon-g: #5ee08f;   /* 발급소 */
  --paper: #f3efe6;
  --ink: #1d1b19;
  --stamp: #d23b2a;
  --f-sign: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-code: "Nanum Gothic Coding", ui-monospace, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--night); color: var(--fg); overflow: hidden; }
body { font-family: var(--f-ui); font-size: 15px; line-height: 1.6; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--neon-y); outline-offset: 2px; border-radius: 8px; }

#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }

.glass {
  background: rgba(16, 18, 26, .74); border: 1px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-radius: 999px; box-shadow: 0 10px 30px -12px rgba(0,0,0,.7);
}
.top {
  position: fixed; z-index: 11; display: flex; justify-content: space-between; gap: 10px; align-items: flex-start;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.signpill { display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 18px; min-width: 0; }
.signpill h1 { margin: 0; font-family: var(--f-sign); font-weight: 400; font-size: 20px; color: var(--neon-p); white-space: nowrap; text-shadow: 0 0 12px rgba(255,92,158,.6); }
.backbtn { display: flex; align-items: center; gap: 6px; margin: -4px 4px -4px -8px; padding: 6px 12px 6px 8px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.backbtn:hover { background: rgba(255,255,255,.14); }
.backbtn svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 400px) { .inside .signpill h1 { display: none; } }
.signpill .sep { width: 1px; height: 16px; background: rgba(255,255,255,.14); }
.who { display: flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.who i { width: 7px; height: 7px; border-radius: 50%; background: var(--neon-g); box-shadow: 0 0 8px var(--neon-g); }
.rightpill { display: flex; padding: 4px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; }
.iconbtn:hover { background: rgba(255,255,255,.07); }
.iconbtn svg { width: 20px; height: 20px; stroke: var(--fg); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.timeline { position: fixed; z-index: 5; top: calc(64px + env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px));
  font-family: var(--f-code); font-size: 12px; color: var(--fg); opacity: .85; text-shadow: 0 1px 3px #000; pointer-events: none; font-variant-numeric: tabular-nums; }
.iconbtn[aria-pressed="true"] svg { stroke: var(--neon-c); }
.feed {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(88px + env(safe-area-inset-top, 0px));
  padding: 7px 14px; font-size: 13px; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; box-sizing: border-box;
  transition: opacity .4s; pointer-events: none;
}
.feed b { color: var(--neon-y); font-weight: 600; }

.tags { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.tag { position: absolute; left: 0; top: 0; white-space: nowrap; display: flex; align-items: center; gap: 6px;
  padding: 3px 10px 3px 3px; border-radius: 999px; background: rgba(243,239,230,.94); color: var(--ink); font-size: 12.5px; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
.tag b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--ink); color: var(--paper); }
.tag.peer { background: rgba(16,18,26,.82); color: var(--fg); border: 1px solid rgba(255,255,255,.1); padding: 3px 10px; }
.tag.peer:empty { display: none; }
.tag.say { max-width: min(260px, 70vw); white-space: normal; padding: 8px 12px; border-radius: 14px; font-size: 13.5px; line-height: 1.45; text-align: center; }
.tag.say::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: rgba(243,239,230,.94); }
.fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 8; }

.prompt {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  padding: 12px 22px; display: flex; gap: 10px; align-items: center; white-space: nowrap; animation: rise .25s ease;
  border-color: color-mix(in srgb, var(--acc, #fff) 55%, transparent);
}
.prompt b { color: var(--acc, var(--fg)); font-weight: 700; }
.prompt small { color: var(--muted); font-size: 12px; }
@keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } }

.actions {
  position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(3, 1fr); width: min(400px, calc(100% - 24px)); box-sizing: border-box; padding: 6px; border-radius: 26px;
}
.act { display: grid; justify-items: center; gap: 3px; padding: 9px 4px 8px; border-radius: 20px; font-size: 13px; }
.act:hover { background: rgba(255,255,255,.05); }
.act svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.act .n { font-family: var(--f-code); font-size: 12px; color: var(--neon-y); }

.joy { position: fixed; z-index: 4; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25); background: rgba(10,12,18,.25); pointer-events: none; }
.joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255,255,255,.35); }
.hint { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); bottom: calc(112px + env(safe-area-inset-bottom, 0px));
  font-size: 12.5px; color: var(--muted); white-space: nowrap; text-shadow: 0 1px 3px #000; pointer-events: none; transition: opacity .6s; }

/* 가게 안 */
.sheet-back { position: fixed; inset: 0; z-index: 9; background: rgba(0,0,0,.5); }
.sheet {
  --acc: var(--neon-y);
  position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: 0;
  width: min(620px, 100%); max-height: calc(100% - 64px - env(safe-area-inset-top, 0px)); overflow-y: auto; box-sizing: border-box;
  background: var(--panel); border-top: 2px solid var(--acc); border-radius: 18px 18px 0 0;
  box-shadow: 0 -20px 60px rgba(0,0,0,.7), 0 -2px 24px -6px var(--acc);
  padding: 18px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  display: grid; gap: 16px; animation: up .28s ease;
}
@keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } }
.shead { display: grid; grid-template-columns: 56px minmax(0, 1fr) 36px; gap: 12px; align-items: center; }
.keeper { width: 56px; height: 56px; border-radius: 16px; background: var(--panel-2); display: grid; place-items: center; border: 1px solid var(--line); }
.keeper svg { width: 44px; height: 44px; }
.shead h2 { margin: 0; font-family: var(--f-sign); font-weight: 400; font-size: 22px; color: var(--acc); line-height: 1.2; text-shadow: 0 0 14px color-mix(in srgb, var(--acc) 45%, transparent); }
.shead p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
.close { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.close:hover { background: rgba(255,255,255,.07); }
.close svg { width: 18px; height: 18px; stroke: var(--fg); fill: none; stroke-width: 1.8; stroke-linecap: round; }

.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
select, input[type="text"], textarea {
  width: 100%; box-sizing: border-box; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; resize: none;
}
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--acc); }
.count { font-family: var(--f-code); font-size: 12px; color: var(--muted); text-align: right; }
.primary { background: var(--acc); color: #0b0c11; border-radius: 12px; padding: 13px 16px; font-weight: 700; }
.primary:disabled { opacity: .45; cursor: default; }
.ghost { border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; }
.ghost:hover { border-color: var(--acc); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.fine { font-size: 12.5px; color: var(--muted); margin: 0; }
.cardsum { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: grid; gap: 4px; }
.cardsum .m { font-family: var(--f-code); font-size: 12px; color: var(--acc); }
.cardsum.prof { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 13px; color: var(--fg); background: var(--panel-2); }
.chip:hover { border-color: var(--acc); color: var(--acc); }
.history { display: grid; gap: 8px; }
.chip.on { border-color: var(--acc); color: #0b0c11; background: var(--acc); }
.months { display: grid; gap: 8px; }
.month { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; font-size: 14.5px; }
.month b { color: var(--acc); font-weight: 600; font-family: var(--f-code); font-size: 13px; padding-top: 2px; }
.month.locked span { filter: blur(5px); user-select: none; }
.stars { color: var(--acc); letter-spacing: 1px; font-size: 13px; }
.meter { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--neon-c), var(--neon-p)); }
.lockbox { border-color: color-mix(in srgb, var(--acc) 50%, var(--line)); }
input[type="date"] { width: 100%; box-sizing: border-box; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 15px; color: var(--fg); }
.hist { display: grid; gap: 2px; text-align: left; background: var(--panel-2); border-left: 3px solid var(--c); border-radius: 0 10px 10px 0; padding: 9px 12px; }
.hist b { font-size: 12px; color: var(--c); font-weight: 600; } .hist span { font-size: 14.5px; overflow-wrap: anywhere; } .hist small { font-size: 12.5px; color: var(--muted); }
.cardsum p { margin: 0; overflow-wrap: anywhere; }

.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--acc); animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
.err { color: #ffb4a8; font-size: 14px; }

.headline { font-family: var(--f-sign); font-size: clamp(22px, 5.4vw, 28px); line-height: 1.35; margin: 0; color: var(--fg); text-wrap: balance; }
.headline em { font-style: normal; color: var(--acc); }
.prose { margin: 0; font-size: 15.5px; overflow-wrap: anywhere; }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.box h4 { margin: 0; font-size: 12px; letter-spacing: .06em; color: var(--acc); font-weight: 600; }
.box ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.quote { font-size: 16px; padding: 12px 14px; border-left: 3px solid var(--acc); background: var(--panel-2); border-radius: 0 10px 10px 0; overflow-wrap: anywhere; }
.copy { font-size: 12.5px; color: var(--acc); padding: 4px 0; justify-self: start; }

/* 거울 대화 */
.chat { display: grid; gap: 10px; }
.bub { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: 15px; overflow-wrap: anywhere; white-space: pre-wrap; }
.bub.them { justify-self: start; background: var(--panel-2); border: 1px solid color-mix(in srgb, var(--acc) 40%, var(--line)); border-bottom-left-radius: 4px; }
.bub.me { justify-self: end; background: var(--acc); color: #0b0c11; border-bottom-right-radius: 4px; }
.composer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.composer .primary { padding: 10px 16px; }

/* 타로 */
.fan { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.tback {
  width: 44px; height: 70px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--acc) 60%, transparent);
  background: repeating-linear-gradient(45deg, #241a35 0 6px, #2d2042 6px 12px); transition: transform .2s;
}
.tback:hover { transform: translateY(-6px); }
.tback[aria-pressed="true"] { transform: translateY(-10px); box-shadow: 0 0 0 2px var(--acc), 0 0 18px var(--acc); }
.tback:disabled { opacity: .3; }
.spread { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tcard { background: #f1e9d8; color: var(--ink); border-radius: 10px; padding: 10px 8px 12px; display: grid; justify-items: center; gap: 4px; text-align: center; aspect-ratio: 3 / 5; align-content: center; animation: flip .5s ease both; }
@keyframes flip { from { transform: rotateY(90deg); } }
.tcard .pos { font-size: 11px; color: #7a6d5a; }
.tcard .num { font-family: var(--f-code); font-size: 12px; color: #7d4bb8; }
.tcard svg { width: 44px; height: 44px; }
.tcard .nm { font-family: var(--f-sign); font-size: 17px; line-height: 1.2; }
.readings { display: grid; gap: 10px; }
.reading b { color: var(--acc); font-weight: 600; }

/* 도장 */
.stamps { display: grid; gap: 10px; }
.stamp-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--panel-2); border-radius: 12px; padding: 10px 12px; }
.stamp-row .dot { width: 40px; height: 40px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--f-sign); font-size: 13px; color: var(--muted); }
.stamp-row.done .dot { border: 2px solid var(--c); color: var(--c); transform: rotate(-12deg); box-shadow: 0 0 10px -2px var(--c); }
.stamp-row span { font-size: 14px; } .stamp-row small { display: block; color: var(--muted); font-size: 12px; }

.safety { background: #2a1416; border: 1px solid #6a2b2e; border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
.safety h3 { margin: 0; font-size: 16px; }
.safety p { margin: 0; font-size: 14px; }
.safety ul { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 4px; }
.safety b { font-family: var(--f-code); font-size: 15px; color: #ffd0c8; user-select: all; }

.certimg { width: min(340px, 100%); justify-self: center; border-radius: 6px; box-shadow: 0 16px 40px -16px rgba(0,0,0,.8); }

.toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -10px); z-index: 20;
  background: var(--paper); color: var(--ink); padding: 9px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: .3s;
  white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

.loading { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--night); text-align: center; transition: opacity .8s; }
.loading h2 { font-family: var(--f-sign); font-weight: 400; font-size: 52px; color: var(--neon-p); margin: 0 0 6px; text-shadow: 0 0 24px rgba(255,92,158,.7); }
.loading p { color: var(--muted); margin: 0; padding: 0 24px; }

@media (max-width: 520px) {
  .signpill { padding: 7px 12px 7px 14px; gap: 9px; } .signpill h1 { font-size: 18px; }
  .iconbtn { width: 36px; height: 36px; }
  .row2 { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="stage" aria-label="왜그래 골목 3D 공간. 끌어서 둘러보고 바닥을 눌러 걸어가세요."></div>
<div class="tags" id="tags"><div class="tag say" id="say" hidden></div></div>

  <div class="rightpill glass">

    </button>
    <button class="iconbtn" id="aboutBtn" aria-label="골목 안내">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
    </button>
  </div>
</div>

  <button class="act" id="actStamp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.3 2.3 4.7-5"/></svg><span>도장 <span class="n" id="stampN">0/3</span></span></button>
  <button class="act" id="actWave"><svg viewBox="0 0 24 24"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V5a1.5 1.5 0 0 1 3 0v6"/><path d="M14 11V6.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.5a6 6 0 0 1-5-2.7L3.8 14.6a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg>손 흔들기</button>
</nav>

<div class="sheet-back" id="sheetBack" hidden></div>

  // 손님 카드: 두 사람의 MBTI와 사이. 고민은 가게마다 따로 맡긴다 (모두 이 기기에만)

  const RULES = `[공통 규칙]

  const cardText = (c, worry, label) => `[손님 카드]

[${label || "이 가게에 맡긴 고민"}]
${worry}` : ""}`;
  function errCopy(e) {

  /* ───────── 3D ───────── */
  if (!window.THREE) { $("loadMsg").textContent = "3D 화면을 불러오지 못했어요. 새로고침해 주세요."; return; }

  const AW = 4, ZMIN = -14, ZMAX = 14;          // 골목 반폭, 길이

  const lam = (color, o = {}) => new THREE.MeshLambertMaterial(Object.assign({ color }, o));

  function tex(w, hh, draw, rep) {
    const c = document.createElement("canvas"); c.width = w; c.height = hh; draw(c.getContext("2d"), w, hh);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;

    t.userData = { c, draw }; return t;

  const redrawables = [];
  const rnd = (() => { let s = 77001; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); })();

  /* 젖은 아스팔트 */

    for (let i = 0; i < 7; i++) { const g = x.createRadialGradient(0, 0, 0, 0, 0, 1); x.save(); x.translate(rnd() * w, rnd() * hh); x.scale(30 + rnd() * 60, 14 + rnd() * 30); g.addColorStop(0, "rgba(8,10,18,.85)"); g.addColorStop(1, "rgba(8,10,18,0)"); x.fillStyle = g; x.beginPath(); x.arc(0, 0, 1, 0, Math.PI * 2); x.fill(); x.restore(); }

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(AW * 2, ZMAX - ZMIN + 4), mat(0xffffff, { map: groundTex, roughness: .32, metalness: .35 }));

  /* 간판 */
  function drawSign(x, w, hh, text, color, opt) {
    x.clearRect(0, 0, w, hh);
    x.fillStyle = opt.lit ? "#0d0e14" : "#1a1a1e"; x.fillRect(0, 0, w, hh);
    x.strokeStyle = opt.lit ? color : "#44454c"; x.lineWidth = 8; x.shadowColor = color; x.shadowBlur = opt.lit ? 24 : 0; x.strokeRect(14, 14, w - 28, hh - 28);

    x.fillText(text, w / 2, hh * (opt.sub ? .42 : .53));

  }
  function sign(text, color, w, hh, opt = {}) {

  /* 건물 윗층 창문 */
  function facadeTex(base) {

      x.fillStyle = base; x.fillRect(0, 0, w, hh);
      for (let i = 0; i < 400; i++) { x.fillStyle = `rgba(0,0,0,${rnd() * .08})`; x.fillRect(rnd() * w, rnd() * hh, 4, 4); }
      for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) {

  redrawables.push(shutterTex);

  const signLights = [], doors = [], tapTargets = [];   // tapTargets: 누르면 그 가게 앞으로 가는 건물들
  function shop(side, z, w, key, label, color, open, sub) {
    const g = new THREE.Group(); g.position.set(side * AW, 0, z); g.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2; BUILD.add(g);

    const wallC = ["#3a3330", "#2f3438", "#3b3a33", "#33303a", "#2d3330"][Math.floor(rnd() * 5)];

    // 돌출 간판
    if (open && rnd() < .8) {
      const chars = label.replace(/\s|MBTI/g, "").slice(0, 4).split("");
      const vt = tex(160, 160 * chars.length + 40, (x, cw, ch) => {
        x.fillStyle = "#0d0e14"; x.fillRect(0, 0, cw, ch); x.strokeStyle = color; x.lineWidth = 8; x.shadowColor = color; x.shadowBlur = 20; x.strokeRect(10, 10, cw - 20, ch - 20);
        x.fillStyle = "#fff"; x.shadowBlur = 26; x.textAlign = "center"; x.textBaseline = "middle"; x.font = '104px "Black Han Sans", sans-serif';
        chars.forEach((c, i) => x.fillText(c, cw / 2, 20 + 160 * (i + .5) + 6));
      });
      redrawables.push(vt);
      const v = new THREE.Mesh(new THREE.PlaneGeometry(.5, .5 * (chars.length + .25)), basic({ map: vt }));
      const vg = new THREE.Group(); vg.position.set(w * .42, 4.6, .9); vg.rotation.y = Math.PI / 2; g.add(vg);
      const back = v.clone(); back.rotation.y = Math.PI; vg.add(v); vg.add(back);
      box(.06, .06, .9, mat(0x222222), w * .42, 5.45, .45, g);
    }
    const doorX = side * (AW - 1.1);
    spots.push({ sp: "alley", key, x: doorX, z, r: 1.7, open, label, color });
    return g;
  }
  // 왼쪽(-) / 오른쪽(+)

      if (keys["w"] || keys["arrowup"]) iy -= 1; if (keys["s"] || keys["arrowdown"]) iy += 1;
      if (keys["a"] || keys["arrowleft"]) ix -= 1; if (keys["d"] || keys["arrowright"]) ix += 1;
      if (joy.active) { ix += joy.x; iy += joy.y; }
    }
    const sy = Math.sin(yaw), cy = Math.cos(yaw);
    let mx = 0, mz = 0;
    if (Math.hypot(ix, iy) > .15) { mx = sy * iy + cy * ix; mz = cy * iy - sy * ix; target = null; route = []; arriveFace = null; hideHint(); }
    else if (target && !sheetOpen) { const dx = target.x - me.x, dz = target.z - me.z, L = Math.hypot(dx, dz); if (L < .12) target = route.shift() || null; else { mx = dx / L; mz = dz / L; } }
    const ml = Math.hypot(mx, mz); me.moving = ml > .05;
    if (me.moving) {
      const sp = 2.8 * Math.min(1, ml) * dt, nx = mx / ml, nz = mz / ml, ox = me.x, oz = me.z;
      if (!blocked(me.x + nx * sp, me.z)) me.x += nx * sp;
      if (!blocked(me.x, me.z + nz * sp)) me.z += nz * sp;
      if (target && Math.hypot(me.x - ox, me.z - oz) < sp * .2) target = route.shift() || null;
      let d = Math.atan2(nx, nz) - me.r; d = Math.atan2(Math.sin(d), Math.cos(d)); me.r += d * Math.min(1, dt * 12);
    }
    me.umb = rainOn && space === "alley"; sun.visible = space === "alley";
    if (!target && !me.moving && arriveFace !== null) { let d = arriveFace - me.r; d = Math.atan2(Math.sin(d), Math.cos(d)); me.r += d * Math.min(1, dt * 8); if (Math.abs(d) < .02) arriveFace = null; }
    meA.g.position.set(me.x, 0, me.z); meA.g.rotation.y = me.r; animateAvatar(meA, me, t, dt); sendPresence(false);
    for (const e of peers.values()) {
      const s = e.st, k = Math.min(1, dt * 8); s.x += (s.tx - s.x) * k; s.z += (s.tz - s.z) * k;
      let d = s.tr - s.r; d = Math.atan2(Math.sin(d), Math.cos(d)); s.r += d * k;
      e.a.g.position.set(s.x, 0, s.z); e.a.g.rotation.y = s.r; animateAvatar(e.a, s, t, dt);
      e.a.g.visible = s.sp === space;
      e.tag.textContent = s.waveUntil > Date.now() ? "안녕하세요" : "";
    }
    const hor = Math.cos(pitch) * camDist;
    want.set(me.x + sy * hor, 1 + Math.sin(pitch) * camDist, me.z + cy * hor);
    const S = SPACES[space];
    if (S) { want.x = clamp(want.x, S.ox - S.W / 2 + .3, S.ox + S.W / 2 - .3); want.z = clamp(want.z, -S.D / 2 + .3, S.D / 2 + 2.4); want.y = Math.min(RH2 - .25, want.y); }
    else { want.x = clamp(want.x, -AW + .6, AW - .6); want.z = clamp(want.z, ZMIN + .5, 13.8); want.y = Math.min(6.5, want.y); }
    camPos.lerp(want, Math.min(1, dt * 6)); camera.position.copy(camPos); look.set(me.x, 1.2, me.z); camera.lookAt(look);
    // 문: 가까이 가면 열림
    for (const d of doors) {
      const dist = space === "alley" ? Math.hypot(me.x - d.x, me.z - d.z) : 99;
      const wantR = dist < 2.6 || d.boost > 0 ? 1.3 : 0; d.boost = Math.max(0, (d.boost || 0) - dt);
      d.pivot.rotation.y += (wantR - d.pivot.rotation.y) * Math.min(1, dt * 5);
    }
    if (S) {
      const dd = Math.hypot(me.x - S.ox, me.z - S.D / 2);
      if (!moving && !sheetOpen && me.moving && me.z > S.D / 2 - .55 && Math.abs(me.x - S.ox) < .7 && performance.now() - enteredAt > 1200) exitShop();
      S.doorOpen = Math.max(0, (S.doorOpen || 0) - dt); S.door.visible = camera.position.z < S.D / 2 - .05;
      S.door.rotation.y += ((dd < 1.9 || S.doorOpen > 0 ? -1.2 : 0) - S.door.rotation.y) * Math.min(1, dt * 5);
      if (S.keeper) {
        const k = S.keeper, a = Math.atan2(me.x - k.x, me.z - k.z);
        k.g.rotation.y += (Math.max(-.9, Math.min(.9, a)) - k.g.rotation.y) * Math.min(1, dt * 3);
        k.body.rotation.z = Math.sin(t * 1.4) * .02; k.head.rotation.x = Math.sin(t * .8) * .04;
        if (Date.now() < sayUntil) { $("say").hidden = false; placeTag($("say"), k.x, k.y + .25, k.z); } else $("say").hidden = true;
      } else $("say").hidden = true;
      if (space === "mirror" && ghost) {
        const Z = S.mirrorZ, lx = me.x - S.ox, lz = me.z;
        ghost.g.position.set(lx, 0, 2 * Z - lz); ghost.g.rotation.y = Math.PI - me.r;
        animateAvatar(ghost, me, t, dt);
      }
      if (space === "tarot" && crystal && !reduced) { crystal.material.emissiveIntensity = .7 + Math.sin(t * 2.2) * .3; crystalLight.intensity = 1 + Math.sin(t * 2.2) * .35; }
      if (!reduced) {
        candles.forEach((c, i) => { c.scale.y = 1.4 + Math.sin(t * 13 + i * 2) * .3; });
        spinners.forEach((o) => { o.o.rotation.y += o.v * dt; });
        bobbers.forEach((o, i) => { o.o.rotation[o.axis] = Math.sin(t * o.sp + i) * o.amp; });
        wisps.forEach((w, i) => { w.position.y += dt * .08; w.material.opacity = .22 * (.5 + .5 * Math.sin(t * 1.5 + i)); if (w.userData.y0 === undefined) w.userData.y0 = w.position.y; if (w.position.y > w.userData.y0 + .25) w.position.y = w.userData.y0; });
        if (rainOn) windowsIn.forEach((w) => { w.streak.offset.y += dt * 1.6; });
      }
      { const d0 = new Date(), sec = d0.getSeconds() + d0.getMilliseconds() / 1000, mn = d0.getMinutes() + sec / 60, hr = (d0.getHours() % 12) + mn / 60;
        clocks.forEach((c) => { c.sp.rotation.z = -sec / 60 * Math.PI * 2; c.mp.rotation.z = -mn / 60 * Math.PI * 2; c.hp.rotation.z = -hr / 12 * Math.PI * 2; }); }
    } else $("say").hidden = true;
    if (!reduced && !S) {
      const pa = rain.geometry.attributes.position.array;
      for (let i = 0; i < rn; i++) { const o = i * 6; pa[o + 1] -= 9 * dt; pa[o + 4] -= 9 * dt; if (pa[o + 4] < 0) { pa[o + 1] = 8; pa[o + 4] = 7.65; } }
      rain.geometry.attributes.position.needsUpdate = true;
      signLights.forEach((l, i) => { l.intensity = (.55 + .45 * lampLevel) * (1.5 + Math.sin(t * 2 + i) * .08) + (Math.random() < .004 ? -1 : 0); });
      endLight.intensity = 2 + Math.sin(t * 1.5) * .2;
      tail.rotation.z = .9 + Math.sin(t * (catWiggle > 0 ? 10 : 1)) * (catWiggle > 0 ? .5 : .15); catWiggle = Math.max(0, catWiggle - dt);
    }
    renderer.render(scene, camera);
    $("myTagText").textContent = me.waveUntil > Date.now() ? "안녕하세요" : me.moving ? "두리번두리번" : S ? `${SHOPS[space].name}에서` : visited().length ? "고민 상담 중" : "골목 손님";
    placeTag(myTag, me.x, 2.15, me.z);
    for (const e of peers.values()) { if (e.st.sp === space) placeTag(e.tag, e.st.x, 2.1, e.st.z); else e.tag.style.visibility = "hidden"; }
    updatePrompt();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame((n) => { last = n; loop(n); setTimeout(() => { const l = $("loading"); l.style.opacity = 0; setTimeout(() => l.remove(), 800); }, 400); });
  if (document.fonts) document.fonts.ready.then(() => { redrawables.forEach((t) => { const c = t.userData.c; t.userData.draw(c.getContext("2d"), c.width, c.height); t.needsUpdate = true; }); }).catch(() => {});
})();
</script>
